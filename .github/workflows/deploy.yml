name: Deploy

# Manuel tetiklenir (Actions sekmesi > Deploy > Run workflow).
# Sunucuda docker-compose.prod.yml çalıştığı, imajların sunucuda --build ile
# üretildiği bir kurulum varsayar. DB migration'ları API boot'ta otomatik koşar
# (TypeORM migrationsRun: true), ayrı bir migration adımı gerekmez.
#
# Gerekli repository secrets:
#   DEPLOY_HOST     — sunucu IP/hostname
#   DEPLOY_USER     — SSH kullanıcısı
#   DEPLOY_SSH_KEY  — özel SSH anahtarı (PEM)
#   DEPLOY_PATH     — sunucuda repo dizini (ör. /opt/koli)
# Opsiyonel:
#   DEPLOY_PORT     — SSH portu (varsayılan 22)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Deploy edilecek branch'
        required: true
        default: 'main'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "→ Fetching ${{ github.event.inputs.branch }}"
            git fetch --all --prune
            git checkout "${{ github.event.inputs.branch }}"
            git pull --ff-only origin "${{ github.event.inputs.branch }}"
            echo "→ Building & starting containers"
            docker compose -f docker-compose.prod.yml up -d --build
            echo "→ Pruning old images"
            docker image prune -f
            echo "→ Done. Service status:"
            docker compose -f docker-compose.prod.yml ps
