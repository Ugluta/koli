# ── Rate limit zones ──────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=5r/m;
limit_req_zone $binary_remote_addr zone=web_general:10m rate=50r/s;

# ── Upstream ──────────────────────────────────────────────────────────────────
upstream api_backend {
    server 127.0.0.1:4000;
    keepalive 32;
}

upstream web_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name koli.app www.koli.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name koli.app www.koli.app;

    ssl_certificate     /etc/letsencrypt/live/koli.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koli.app/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20M;

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_general burst=60 nodelay;

        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_read_timeout  30s;
        proxy_connect_timeout 5s;
    }

    # Strict throttle on auth endpoints
    location ~ ^/api/v1/auth/(login|register|refresh) {
        limit_req zone=api_auth burst=3 nodelay;

        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Sitemap / robots (served by Next.js) ─────────────────────────────────
    location ~ ^/(sitemap.*\.xml|robots\.txt) {
        proxy_pass         http://web_frontend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_valid  200 1h;
        add_header         Cache-Control "public, max-age=3600";
    }

    # ── Next.js static assets ──────────────────────────────────────────────
    location /_next/static/ {
        proxy_pass         http://web_frontend;
        add_header         Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Web frontend ───────────────────────────────────────────────────────
    location / {
        limit_req zone=web_general burst=100 nodelay;

        proxy_pass         http://web_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout 30s;
    }

    # ── Block common attack paths ──────────────────────────────────────────
    location ~* \.(php|asp|aspx|jsp|cgi)$ { return 404; }
    location ~ /\. { deny all; }
}
